[project]
name = "doc-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "notebook>=7.6.3",
    "pdf2image>=1.17.0",
    "pip-system-certs>=5.3",
    "pytesseract>=0.3.13",
    "python-doctr[viz]>=1.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = ["packages/*"]

